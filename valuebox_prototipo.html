<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyería v4.0 - JewelryBox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui; background: #f0f2f5; padding: 20px; }
        .app-container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a1a2e; color: white; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo h1 { font-size: 1.5rem; }
        .logo p { font-size: 0.8rem; opacity: 0.7; }
        .last-update { background: #16213e; padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; }
        .nav-modules { background: #16213e; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #0f3460; }
        .nav-modules a { color: #aaa; text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; transition: 0.2s; }
        .nav-modules a.active { background: #e94560; color: white; }
        .nav-modules a:hover:not(.active) { background: #0f3460; color: white; }
        .main-content { padding: 24px; }
        .two-columns { display: flex; gap: 24px; flex-wrap: wrap; }
        .left-column { flex: 2; min-width: 300px; }
        .right-column { flex: 1; min-width: 250px; }
        .card { background: #f8f9fa; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 0.85rem; text-transform: uppercase; color: #666; margin-bottom: 12px; }
        .card-value { font-size: 2rem; font-weight: 700; color: #1a1a2e; }
        .card-change { margin-top: 8px; font-size: 0.9rem; }
        .positive { color: #2e7d32; }
        .negative { color: #c62828; }
        .mini-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-top: 12px; }
        .bar { flex: 1; background: #e94560; border-radius: 4px 4px 0 0; transition: height 0.3s; }
        .line-chart { margin-top: 20px; padding: 10px 0; }
        .chart-points { display: flex; justify-content: space-between; align-items: flex-end; height: 150px; margin: 20px 0; gap: 8px; }
        .point { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .point-bar { width: 100%; background: #e94560; border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.3s; }
        .point-label { font-size: 0.7rem; color: #666; text-align: center; }
        .point-value { font-size: 0.7rem; font-weight: bold; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .data-table th, .data-table td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #e0e0e0; }
        .data-table th { background: #f1f3f5; font-weight: 600; font-size: 0.8rem; }
        .data-table tr { cursor: pointer; transition: background 0.2s; }
        .data-table tr:hover { background: #f1f5f9; }
        .actions-bar { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-primary { background: #e94560; color: white; }
        .btn-primary:hover { background: #c72a48; }
        .btn-secondary { background: #e9ecef; color: #1a1a2e; }
        .btn-secondary:hover { background: #dee2e6; }
        .alerts-box { margin-top: 20px; background: #fff8e1; border-left: 4px solid #ffc107; border-radius: 12px; padding: 16px 20px; }
        .alert-item { font-size: 0.85rem; margin-bottom: 8px; }
        .spot-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .spot-name { font-weight: 500; }
        .spot-price { font-weight: 700; }
        .breadcrumb { margin-bottom: 20px; font-size: 0.85rem; color: #666; }
        .breadcrumb span { cursor: pointer; color: #e94560; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-modal { cursor: pointer; font-size: 1.5rem; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.85rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 12px; }
        .radio-group { display: flex; gap: 20px; margin: 12px 0; }
        @media (max-width: 768px) { .two-columns { flex-direction: column; } .data-table th, .data-table td { font-size: 0.7rem; padding: 6px; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo"><h1>Joyería v4.0</h1><p>Sistema de Gestión</p></div>
        <div class="last-update">📅 Última act: 04/06/2026 16:30</div>
    </div>
    <div class="nav-modules">
        <a href="#">Dashboard</a><a href="#">Presupuestos</a><a href="#">Inventario</a>
        <a href="#">Compras</a><a href="#">Reportes</a><a href="#">Configuración</a>
        <a href="#" class="active">💍 JewelryBox</a>
    </div>
    <div class="main-content" id="mainContent"></div>
</div>

<div id="modalAdd" class="modal"><div class="modal-content"><div class="modal-header"><h3>Agregar material</h3><span class="close-modal" onclick="closeModal()">&times;</span></div>
    <div class="radio-group" id="materialTypeGroup"><label><input type="radio" name="materialType" value="puro" checked> Metal puro</label><label><input type="radio" name="materialType" value="chatarra"> Chatarra</label><label><input type="radio" name="materialType" value="soldadura"> Soldadura</label></div>
    <div id="formPuro"><div class="form-group"><label>Metal:</label><select><option>Oro</option><option>Plata</option><option>Cobre</option></select></div><div class="form-group"><label>Pureza:</label><select><option>24K</option><option>18K</option><option>14K</option></select></div><div class="form-group"><label>Peso (gr):</label><input type="number"></div><div class="form-group"><label>Fecha compra:</label><input type="date"></div><div class="form-group"><label>Costo (S/ total):</label><input type="number"></div></div>
    <div id="formChatarra" style="display:none;"><div class="form-group"><label>Tipo joya:</label><select><option>Anillo</option><option>Cadena</option></select></div><div class="form-group"><label>Kilate:</label><select><option>18K</option><option>14K</option></select></div><div class="form-group"><label>Peso (gr):</label><input type="number"></div><div class="form-group"><label>Fecha compra:</label><input type="date"></div><div class="form-group"><label>Costo (S/ total):</label><input type="number"></div></div>
    <div id="formSoldadura" style="display:none;"><div class="form-group"><label>Tipo:</label><select><option>Soldadura plata</option><option>Soldadura oro</option></select></div><div class="form-group"><label>Calidad:</label><select><option>Alta</option><option>Media</option></select></div><div class="form-group"><label>Peso (gr):</label><input type="number"></div><div class="form-group"><label>Fecha compra:</label><input type="date"></div><div class="form-group"><label>Costo (S/ total):</label><input type="number"></div></div>
    <div style="margin-top:20px; text-align:right;"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="closeModal()">Guardar (demo)</button></div>
</div></div>

<script>
    let currentView = 'resumen';
    let currentMetal = null;
    let currentMaterialDetail = null;

    const spotsData = [
        { name: 'Oro 24K', price: 490.36, change: -0.06, changePct: -0.012 },
        { name: 'Plata 999', price: 8.14, change: -0.004, changePct: -0.049 },
        { name: 'Platino', price: 60.97, change: -0.02, changePct: -0.033 },
        { name: 'Paladio', price: 42.17, change: -0.49, changePct: -1.15 },
        { name: 'Cobre', price: 0.032, change: 0, changePct: 0 },
        { name: 'Latón', price: 0.028, change: 0, changePct: 0 }
    ];

    const metalsData = {
        oro: { name: 'ORO', totalPeso: 100, totalCosto: 29770, totalValor: 16447, gananciaPorc: 40,
               items: [
                   { id: 'oro24', tipo: 'Oro fino', kilate: '24K (100%)', peso: 20, costoGr: 456, costoTotal: 9120, valorHoy: 9780, gananciaPorc: 7.2, gananciaSoles: 660, queHacer: 'Guardar' },
                   { id: 'chatarra18', tipo: 'Chatarra oro', kilate: '18K (75%)', peso: 50, costoGr: 245, costoTotal: 12250, valorHoy: 3667, gananciaPorc: 49, gananciaSoles: 1200, queHacer: 'Restaurar' },
                   { id: 'chatarra14', tipo: 'Chatarra oro', kilate: '14K (58.5%)', peso: 30, costoGr: 280, costoTotal: 8400, valorHoy: 3000, gananciaPorc: 15, gananciaSoles: 450, queHacer: 'Usar' }
               ] },
        plata: { name: 'PLATA', totalPeso: 1090, totalCosto: 3170, totalValor: 8600, gananciaPorc: 171,
                 items: [
                     { id: 'plataPina', tipo: 'Plata piña', kilate: '999 (100%)', peso: 890, costoGr: 3, costoTotal: 2670, valorHoy: 7120, gananciaPorc: 166, gananciaSoles: 4450, queHacer: 'Vender' },
                     { id: 'plataChatarra', tipo: 'Chatarra plata', kilate: '925 (92.5%)', peso: 200, costoGr: 2.5, costoTotal: 500, valorHoy: 1480, gananciaPorc: 130, gananciaSoles: 980, queHacer: 'Fundir' }
                 ] },
        cobre: { name: 'COBRE', totalPeso: 200, totalCosto: 3.4, totalValor: 6.46, gananciaPorc: 90,
                 items: [ { id: 'cobre1', tipo: 'Cobre', kilate: '-', peso: 200, costoGr: 0.017, costoTotal: 3.4, valorHoy: 6.46, gananciaPorc: 90, gananciaSoles: 3.06, queHacer: 'Usar' } ] },
        soldaduras: { name: 'SOLDADURAS', totalPeso: 50, totalCosto: 200, totalValor: 262, gananciaPorc: 31,
                      items: [
                          { id: 'soldPlataAlta', tipo: 'Soldadura plata', kilate: 'Alta (65% Ag)', peso: 30, costoGr: 4, costoTotal: 120, valorHoy: 157, gananciaPorc: 31, gananciaSoles: 37, queHacer: 'Usar' },
                          { id: 'soldPlataMedia', tipo: 'Soldadura plata', kilate: 'Media (50% Ag)', peso: 20, costoGr: 4, costoTotal: 80, valorHoy: 105, gananciaPorc: 31, gananciaSoles: 25, queHacer: 'Usar' }
                      ] }
    };

    function render() {
        const container = document.getElementById('mainContent');
        if (currentView === 'resumen') renderResumen(container);
        else if (currentView === 'detalleMetal') renderDetalleMetal(container);
        else if (currentView === 'detalleMaterial') renderDetalleMaterial(container);
        else if (currentView === 'evolucion') renderEvolucion(container);
        else if (currentView === 'alertas') renderAlertas(container);
    }

    function renderSpotsColumn() {
        return `<div class="card"><div class="card-title">SPOTS HOY (S/ gramo)</div>
                ${spotsData.map(s => `<div class="spot-item"><span class="spot-name">${s.name}</span><span class="spot-price">S/ ${s.price.toFixed(s.price<1 ? 3 : 2)} ${s.change<0 ? '▼' : s.change>0 ? '▲' : '▸'} ${Math.abs(s.change).toFixed(s.price<1 ? 3 : 2)}</span></div>`).join('')}
                </div>`;
    }

    function renderResumen(container) {
        const totalValor = 16447 + 8600 + 6.46 + 262;
        const totalCosto = 29770 + 3170 + 3.4 + 200;
        const totalGananciaPorc = ((totalValor - totalCosto) / totalCosto * 100).toFixed(1);
        container.innerHTML = `
            <div class="two-columns">
                <div class="left-column">
                    <div class="stats-row" style="display:flex; gap:20px; flex-wrap:wrap;">
                        <div class="card" style="flex:1"><div class="card-title">TOTAL VALORIZADO</div><div class="card-value">S/ ${totalValor.toFixed(0)}</div><div class="card-change positive">▲ +${totalGananciaPorc}% vs compra</div></div>
                        <div class="card" style="flex:1"><div class="card-title">EVOLUCIÓN (30 días)</div><div class="mini-chart" id="miniChart"></div></div>
                    </div>
                    <div class="actions-bar">
                        <button class="btn btn-primary" onclick="openModal()">+ Agregar material</button>
                        <button class="btn btn-secondary" onclick="changeView('evolucion')">📈 Evolución por mes</button>
                        <button class="btn btn-secondary" onclick="changeView('alertas')">⚙️ Alertas</button>
                    </div>
                    <h3 style="margin:20px 0 10px">LO QUE TIENES AHORA (clic para desglosar)</h3>
                    <table class="data-table"><thead><tr><th>Metal</th><th>Peso (gr)</th><th>Valor hoy</th><th>Ganancia</th><th>¿Qué hacer?</th></tr></thead>
                    <tbody>
                        <tr onclick="viewMetalDetail('oro')"><td>▶ ORO</td><td>${metalsData.oro.totalPeso}</td><td>S/ ${metalsData.oro.totalValor}</td><td class="positive">▲ +${metalsData.oro.gananciaPorc}%</td><td>Guardar</td></tr>
                        <tr onclick="viewMetalDetail('plata')"><td>▶ PLATA</td><td>${metalsData.plata.totalPeso}</td><td>S/ ${metalsData.plata.totalValor}</td><td class="positive">▲ +${metalsData.plata.gananciaPorc}%</td><td>Vender</td></tr>
                        <tr onclick="viewMetalDetail('cobre')"><td>▶ COBRE</td><td>${metalsData.cobre.totalPeso}</td><td>S/ ${metalsData.cobre.totalValor}</td><td class="positive">▲ +${metalsData.cobre.gananciaPorc}%</td><td>Usar</td></tr>
                        <tr onclick="viewMetalDetail('soldaduras')"><td>▶ SOLDADURAS</td><td>${metalsData.soldaduras.totalPeso}</td><td>S/ ${metalsData.soldaduras.totalValor}</td><td class="positive">▲ +${metalsData.soldaduras.gananciaPorc}%</td><td>Guardar</td></tr>
                    </tbody></table>
                    <div class="alerts-box"><h4>⚠️ ALERTAS</h4><div class="alert-item">💰 Plata +166% desde compra. Considera vender.</div><div class="alert-item">🔧 Chatarra 18K: mejor restaurar que fundir.</div></div>
                </div>
                <div class="right-column">${renderSpotsColumn()}</div>
            </div>
        `;
        setTimeout(() => {
            const chart = document.getElementById('miniChart');
            if(chart) { chart.innerHTML = ''; [14700,15100,14900,15800,17500,21000].forEach(v => { const bar = document.createElement('div'); bar.className = 'bar'; bar.style.height = (v/21000*70)+'px'; chart.appendChild(bar); }); }
        }, 10);
    }

    function renderDetalleMetal(container) {
        const metal = metalsData[currentMetal];
        if(!metal) return;
        // Datos de evolución del metal (precio por gramo en S/)
        const precioHistorico = [510, 505, 490, 475, 460, 450, 445, 455, 470, 480, 489];
        const meses = ['Ago', 'Sep', 'Oct', 'Nov', 'Dic', 'Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'];
        container.innerHTML = `
            <div class="breadcrumb"><span onclick="changeView('resumen')">JewelryBox</span> > ${metal.name}</div>
            <div class="two-columns">
                <div class="left-column">
                    <div class="stats-row" style="display:flex; gap:20px; flex-wrap:wrap;">
                        <div class="card" style="flex:1"><div class="card-title">VALOR TOTAL ${metal.name}</div><div class="card-value">S/ ${metal.totalValor}</div><div class="card-change positive">▲ +${metal.gananciaPorc}% vs compra</div></div>
                    </div>
                    <div class="card"><div class="card-title">EVOLUCIÓN DEL ${metal.name} (precio por gramo en S/)</div>
                        <div class="line-chart">
                            <div class="chart-points" id="lineChartMetal"></div>
                            <div style="font-size:0.7rem; color:#666; margin-top:8px;">📍 Tu costo promedio: S/ ${(metal.totalCosto/metal.totalPeso).toFixed(0)}/gr | 📍 Precio hoy: S/ ${spotsData.find(s=>s.name.includes('Oro'))?.price || 0}/gr</div>
                        </div>
                    </div>
                    <h3 style="margin:20px 0 10px">DESGLOSE DE ${metal.name}</h3>
                    <table class="data-table"><thead><tr><th>Tipo</th><th>Kilate</th><th>Peso</th><th>Valor hoy</th><th>Ganancia</th><th>¿Qué hacer?</th></tr></thead>
                    <tbody>${metal.items.map(item => `<tr onclick="viewMaterialDetail('${currentMetal}','${item.id}')"><td>▶ ${item.tipo}</td><td>${item.kilate}</td><td>${item.peso}gr</td><td>S/ ${item.valorHoy}</td><td class="positive">▲ +${item.gananciaPorc}%</td><td>${item.queHacer}</td></tr>`).join('')}</tbody></table>
                    <div class="actions-bar"><button class="btn btn-secondary" onclick="changeView('resumen')">← Volver</button></div>
                </div>
                <div class="right-column">${renderSpotsColumn()}</div>
            </div>
        `;
        setTimeout(() => {
            const container = document.getElementById('lineChartMetal');
            if(container) {
                container.innerHTML = '';
                const max = Math.max(...precioHistorico);
                precioHistorico.forEach((p, i) => {
                    const height = (p / max) * 120;
                    container.innerHTML += `<div class="point"><div class="point-bar" style="height:${height}px"></div><div class="point-value">S/${p}</div><div class="point-label">${meses[i]}</div></div>`;
                });
            }
        }, 10);
    }

    function renderDetalleMaterial(container) {
        const metal = metalsData[currentMetal];
        const item = metal.items.find(i => i.id === currentMaterialDetail);
        if(!item) return;
        container.innerHTML = `
            <div class="breadcrumb"><span onclick="changeView('resumen')">JewelryBox</span> > <span onclick="viewMetalDetail('${currentMetal}')">${metal.name}</span> > ${item.tipo}</div>
            <div class="two-columns">
                <div class="left-column">
                    <div class="stats-row" style="display:flex; gap:20px;">
                        <div class="card"><div class="card-title">VALOR ACTUAL</div><div class="card-value">S/ ${item.valorHoy}</div><div class="card-change positive">▲ +${item.gananciaPorc}%</div></div>
                    </div>
                    <div class="card"><div class="card-title">DETALLE DE COMPRA</div>
                        <p>Fecha: ${item.fechaCompra || 'nov 2025 / may 2022'}<br>Peso: ${item.peso} gr<br>Costo pagado: S/ ${item.costoGr}/gr (total S/ ${item.costoTotal})<br>Valor hoy: S/ ${(item.valorHoy/item.peso).toFixed(2)}/gr<br>Ganancia: S/ ${item.gananciaSoles}</p>
                    </div>
                    <div class="card"><div class="card-title">¿QUÉ HACER?</div>
                        <p>• Vender como material → ~S/ ${(item.valorHoy*0.95).toFixed(0)}<br>• Hacer joyas → costo confección ~S/ 11/gr<br>• Recomendación: ${item.queHacer}</p>
                    </div>
                    <div class="actions-bar"><button class="btn btn-secondary" onclick="viewMetalDetail('${currentMetal}')">← Volver</button></div>
                </div>
                <div class="right-column">${renderSpotsColumn()}</div>
            </div>
        `;
    }

    function renderEvolucion(container) {
        container.innerHTML = `
            <div class="breadcrumb"><span onclick="changeView('resumen')">JewelryBox</span> > Evolución por mes</div>
            <div class="two-columns">
                <div class="left-column">
                    <div class="card"><div class="card-title">EVOLUCIÓN DE TU CAJÓN</div>
                        <div style="display:flex; align-items:flex-end; gap:12px; margin:30px 0; height:200px;">
                            <div style="flex:1; background:#e94560; height:80px; border-radius:8px 8px 0 0; text-align:center;">Ene<br>S/15.4k</div>
                            <div style="flex:1; background:#e94560; height:75px; border-radius:8px 8px 0 0; text-align:center;">Feb<br>S/15.4k</div>
                            <div style="flex:1; background:#e94560; height:70px; border-radius:8px 8px 0 0; text-align:center;">Mar<br>S/14.9k</div>
                            <div style="flex:1; background:#e94560; height:78px; border-radius:8px 8px 0 0; text-align:center;">Abr<br>S/15.6k</div>
                            <div style="flex:1; background:#e94560; height:79px; border-radius:8px 8px 0 0; text-align:center;">May<br>S/15.8k</div>
                            <div style="flex:1; background:#e94560; height:105px; border-radius:8px 8px 0 0; text-align:center;">Jun<br>S/20.6k</div>
                        </div>
                    </div>
                    <div class="actions-bar"><button class="btn btn-secondary" onclick="changeView('resumen')">← Volver</button></div>
                </div>
                <div class="right-column">${renderSpotsColumn()}</div>
            </div>
        `;
    }

    function renderAlertas(container) {
        container.innerHTML = `
            <div class="breadcrumb"><span onclick="changeView('resumen')">JewelryBox</span> > Configurar alertas</div>
            <div class="two-columns">
                <div class="left-column">
                    <div class="card"><div class="card-title">ALERTAS POR METAL</div>
                        <label>☑ Oro → Alertar cuando <select><option>baje 5%</option></select> en <select><option>3 días</option></select></label><br>
                        <label>☑ Plata → Alertar cuando <select><option>suba 10%</option></select> en <select><option>7 días</option></select></label><br>
                    </div>
                    <div class="card"><div class="card-title">ALERTAS POR VALOR DE CAJÓN</div>
                        <label>☑ Cuando supere S/ <input value="25000" size="6"></label><br>
                        <label>☑ Cuando baje de S/ <input value="10000" size="6"></label><br>
                    </div>
                    <div class="actions-bar"><button class="btn btn-secondary" onclick="changeView('resumen')">← Volver</button><button class="btn btn-primary" onclick="alert('Guardado (demo)'); changeView('resumen');">Guardar</button></div>
                </div>
                <div class="right-column">${renderSpotsColumn()}</div>
            </div>
        `;
    }

    function changeView(view) { currentView = view; render(); }
    function viewMetalDetail(metal) { currentMetal = metal; currentView = 'detalleMetal'; render(); }
    function viewMaterialDetail(metal, materialId) { currentMetal = metal; currentMaterialDetail = materialId; currentView = 'detalleMaterial'; render(); }
    function openModal() { document.getElementById('modalAdd').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalAdd').style.display = 'none'; }
    function updateFormVisibility() {
        const type = document.querySelector('input[name="materialType"]:checked').value;
        document.getElementById('formPuro').style.display = type === 'puro' ? 'block' : 'none';
        document.getElementById('formChatarra').style.display = type === 'chatarra' ? 'block' : 'none';
        document.getElementById('formSoldadura').style.display = type === 'soldadura' ? 'block' : 'none';
    }
    document.querySelectorAll('input[name="materialType"]').forEach(r => r.addEventListener('change', updateFormVisibility));
    window.onload = () => { updateFormVisibility(); changeView('resumen'); };
    window.closeModal = closeModal; window.openModal = openModal;
