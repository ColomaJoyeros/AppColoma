<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloma App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-[#161b22] p-8 rounded-2xl border border-[#30363d] w-full max-w-md">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-white mb-1">Coloma App</h1>
                <p class="text-[#8b949e] text-sm mb-6">Dashboard Spot Metals</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-sm text-[#8b949e] block mb-1">Ingresa la clave</label>
                    <input type="password" id="claveInput" 
                           class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-4 py-2 text-white focus:outline-none focus:border-yellow-500 transition"
                           placeholder="Clave de acceso">
                </div>
                <button id="btnEntrar" 
                        class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-semibold py-2 rounded-lg transition">
                    Entrar
                </button>
                <p id="errorMsg" class="text-red-500 text-sm text-center h-5"></p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ PROTOTIPO: Clave hardcodeada
        // TODO: Reemplazar con autenticación real contra Sis_Usuarios
        const CLAVE_CORRECTA = '2025';

        if (localStorage.getItem('acceso_autorizado') === 'true') {
            redirigir();
        }

        document.getElementById('btnEntrar').addEventListener('click', validarClave);
        document.getElementById('claveInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') validarClave();
        });

        function validarClave() {
            const input = document.getElementById('claveInput');
            const error = document.getElementById('errorMsg');
            
            if (input.value === CLAVE_CORRECTA) {
                localStorage.setItem('acceso_autorizado', 'true');
                redirigir();
            } else {
                error.textContent = '❌ Clave incorrecta';
                input.value = '';
                input.focus();
            }
        }

        function redirigir() {
            const esMovil = window.innerWidth < 768;
            window.location.href = esMovil ? 'DsbMov.html' : 'DsbDesk.html';
        }
    </script>
</body>
</html>
