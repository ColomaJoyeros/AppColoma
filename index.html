<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloma App</title>
    <style>
        body { background: #0d1117; font-family: 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #161b22; border: 1px solid #334155; border-radius: 16px; padding: 40px; text-align: center; max-width: 360px; width: 100%; }
        h1 { color: #fff; font-size: 24px; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        input { background: #1e293b; border: 1px solid #475569; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 16px; width: 100%; text-align: center; margin-bottom: 16px; }
        button { background: #eab308; color: #000; font-weight: bold; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
        .error { color: #f87171; font-size: 12px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Coloma App</h1>
        <p>Dashboard de Joyería</p>
        <input type="password" id="clave" placeholder="Ingresa la clave" autofocus>
        <button onclick="verificar()">Entrar</button>
        <div class="error" id="error">Clave incorrecta</div>
    </div>
    <script>
        function verificar() {
            const clave = document.getElementById('clave').value;
            if (clave === 'coloma2026') {
                window.location.href = 'DsbDesk.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
        // Enter key
        document.getElementById('clave').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') verificar();
        });
    </script>
</body>
</html>
