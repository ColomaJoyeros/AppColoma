<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Joyería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(234, 179, 8, 0.1); color: #eab308; }
        .sidebar-item.active { background: rgba(234, 179, 8, 0.15); color: #eab308; border-left: 3px solid #eab308; }
        .trend-up { color: #4ade80; }
        .trend-down { color: #f87171; }
        .trend-flat { color: #94a3b8; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        .drawer { transition: transform 0.3s ease; }
        .drawer.open { transform: translateX(0); }
        .overlay { transition: opacity 0.3s ease; }
        .calc-tab {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #1e293b;
            border: 1px solid #334155;
            border-right: none;
            border-radius: 8px 0 0 8px;
            padding: 16px 8px;
            cursor: pointer;
            z-index: 19;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #94a3b8;
            transition: all 0.2s ease;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.3);
        }
        .calc-tab:hover { background: #f59e0b; color: #0f172a; border-color: #f59e0b; padding-right: 14px; }
        .negocio-tabla th { text-align: left; padding: 10px 8px; border-bottom: 1px solid #334155; color: #94a3b8; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .negocio-tabla td { padding: 10px 8px; border-bottom: 1px solid #1e293b; font-size: 0.9rem; }
        .pvp-card .price { font-size: 2rem; font-weight: 700; }
        .pvp-card .timestamp { font-size: 0.75rem; color: #94a3b8; }
        .pvp-card .diff { font-size: 0.8rem; }
    </style>
</head>
<body class="bg-[#0d1117] text-slate-200 min-h-screen flex">

    <aside class="w-60 bg-[#161b22] border-r border-slate-800 flex flex-col fixed h-full z-10">
        <div class="p-5 border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-yellow-500 rounded-lg flex items-center justify-center text-black font-bold text-base">Au</div>
                <div>
                    <div class="text-base font-bold text-white"></div>
                    <div class="text-sm text-slate-500"></div>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto text-base">
            <div class="text-sm uppercase tracking-widest text-slate-600 px-3 py-2 mt-2" id="menu-titulo"></div>
            <a class="sidebar-item active flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer" data-piso="dashboard"><span id="menu-dashboard"></span></a>
            <a class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 cursor-pointer" data-piso="presupuestos"><span id="menu-presupuestos"></span></a>
            <a class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 cursor-pointer" data-piso="inventario"><span id="menu-inventario"></span></a>
            <a class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 cursor-pointer" data-piso="compras"><span id="menu-compras"></span></a>
            <a class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 cursor-pointer" data-piso="reportes"><span id="menu-reportes"></span></a>
            <a class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 cursor-pointer" data-piso="configuracion"><span id="menu-configuracion"></span></a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-sm font-bold">AU</div>
                <div>
                    <div class="text-sm font-medium text-white" id="sistema-etiqueta"></div>
                    <div class="text-sm text-slate-500" id="sistema-auto"></div>
                </div>
            </div>
        </div>
    </aside>

    <main class="ml-60 flex-1 flex flex-col min-h-screen">
        <header class="bg-[#161b22] border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h1 class="text-xl font-bold text-white" id="page-title"></h1>
                <p class="text-sm text-slate-500" id="page-subtitle"></p>
            </div>
            <div class="flex items-center gap-4 text-base">
                <div class="text-right">
                    <div class="text-sm text-slate-500" id="label-ultima-act"></div>
                    <div class="font-medium text-slate-300 mono text-sm" id="last-update">---</div>
                </div>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-400 text-sm" id="fuente-header">---</span>
                <button id="btn-actualizar" class="bg-yellow-500 hover:bg-yellow-400 text-black font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition text-sm"></button>
            </div>
        </header>

        <div class="p-6 space-y-6 flex-1">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-[#161b22] border border-slate-800 rounded-xl p-4">
                    <div class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3" id="divisas-titulo"></div>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-base text-slate-400" id="tc-ref-etq"></span>
                            <div class="text-right">
                                <span class="text-xs mono" id="tc-ref-dif">---</span>
                                <span class="text-lg font-bold text-white mono ml-1" id="tc-ref-val">---</span>
                                <span class="text-sm ml-1" id="tc-ref-ico">---</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-base text-slate-400" id="tc-vta-etq"></span>
                            <div class="text-right">
                                <span class="text-xs mono" id="tc-vta-dif">---</span>
                                <span class="text-lg font-bold text-white mono ml-1" id="tc-vta-val">---</span>
                                <span class="text-sm ml-1" id="tc-vta-ico">---</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-base text-slate-400" id="tc-cpra-etq"></span>
                            <div class="text-right">
                                <span class="text-xs mono" id="tc-cpra-dif">---</span>
                                <span class="text-lg font-bold text-white mono ml-1" id="tc-cpra-val">---</span>
                                <span class="text-sm ml-1" id="tc-cpra-ico">---</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-[#161b22] border border-yellow-500/30 rounded-xl p-4">
                    <div class="text-sm font-semibold text-yellow-500 uppercase tracking-wider mb-3" id="pvp-titulo"></div>
                    <div class="space-y-4">
                        <div>
                            <div class="text-sm text-slate-400 mb-1" id="pvp-oro-etq"></div>
                            <div class="flex justify-between items-baseline">
                                <span class="text-3xl font-bold text-yellow-400 mono" id="pvp-oro-val">---</span>
                                <span class="text-sm" id="pvp-oro-dif">---</span>
                            </div>
                            <div class="text-xs text-slate-500 mt-1" id="pvp-oro-ts">---</div>
                        </div>
                        <div class="pt-3 border-t border-slate-800">
                            <div class="text-sm text-slate-400 mb-1" id="pvp-plata-etq"></div>
                            <div class="flex justify-between items-baseline">
                                <span class="text-3xl font-bold text-slate-300 mono" id="pvp-plata-val">---</span>
                                <span class="text-sm" id="pvp-plata-dif">---</span>
                            </div>
                            <div class="text-xs text-slate-500 mt-1" id="pvp-plata-ts">---</div>
                        </div>
                    </div>
                </div>

                <div class="hidden lg:block"></div>
            </div>

            <div>
                <div class="bg-[#161b22] border border-slate-800 rounded-xl p-4">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="text-sm font-semibold text-slate-500 uppercase tracking-wider" id="mercado-titulo"></div>
                        <span class="text-xs text-slate-600 mono bg-slate-800 px-2 py-0.5 rounded" id="market-ts">---</span>
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="mercado-container"></div>
                </div>
            </div>

            <div>
                <h2 class="text-base font-semibold text-slate-400 uppercase tracking-wider mb-3" id="negocio-titulo"></h2>
                <div class="bg-[#161b22] border border-slate-800 rounded-xl overflow-x-auto" id="negocio-container"></div>
            </div>
        </div>

        <footer class="border-t border-slate-800 px-6 py-3 flex items-center justify-between text-sm text-slate-600">
            <span id="footer-info"></span>
            <span class="mono" id="live-clock"></span>
        </footer>
    </main>

    <div id="calc-tab" class="calc-tab" onclick="openCalc()"></div>
    <div id="overlay" class="overlay fixed inset-0 bg-black/60 z-20 hidden" onclick="closeCalc()"></div>
    <div id="drawer" class="drawer fixed right-0 top-0 h-full w-full max-w-md bg-[#161b22] border-l border-slate-800 z-30 transform translate-x-full shadow-2xl overflow-y-auto">
        <div class="sticky top-0 bg-[#161b22] border-b border-slate-800 px-5 py-4 flex items-center justify-between z-10">
            <h2 class="text-lg font-bold text-white"></h2>
            <button class="text-slate-400 hover:text-white text-xl" onclick="closeCalc()">✕</button>
        </div>
        <div class="p-5 space-y-4"></div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwhOQvw7EieEiMggEj_3h4F7UQi19D629NEBfICPwnRRxBe3I0bn7dzB51oQFmuPcyM/exec';
        let cache = {};

        async function cargarDatos() {
            const btn = document.getElementById('btn-actualizar');
            btn.disabled = true;
            btn.innerHTML = '...';
            try {
                const r = await fetch(WEB_APP_URL + '?piso=dashboard');
                const j = await r.json();
                if (j.success && j.data) {
                    cache = j.data;
                    renderizar(cache);
                }
            } catch (e) { console.error(e); }
            btn.disabled = false;
            btn.innerHTML = '↻';
        }

        function renderizar(d) {
            const s = (v) => v || '---';
            document.getElementById('page-title').textContent = s(d.WEB_DS_MENU_DASHBOARD);
            document.getElementById('page-subtitle').textContent = s(d.WEB_DS_HEADER_SUBTITULO);
            document.getElementById('label-ultima-act').textContent = s(d.WEB_DS_HEADER_ULTIMA_ACT);
            document.getElementById('btn-actualizar').textContent = s(d.WEB_DS_BTN_ACTUALIZAR);
            document.getElementById('last-update').textContent = s(d.WEB_UI_TC_TS_ALL);
            document.getElementById('fuente-header').textContent = s(d.WEB_UI_SIS_FUENTE_ACT);
            document.getElementById('calc-tab').textContent = s(d.WEB_DS_CALC_BTN);

            document.getElementById('menu-titulo').textContent = s(d.WEB_DS_MENU_TITULO);
            document.getElementById('menu-dashboard').textContent = s(d.WEB_DS_MENU_DASHBOARD);
            document.getElementById('menu-presupuestos').textContent = s(d.WEB_DS_MENU_PRESUPUESTOS);
            document.getElementById('menu-inventario').textContent = s(d.WEB_DS_MENU_INVENTARIO);
            document.getElementById('menu-compras').textContent = s(d.WEB_DS_MENU_COMPRAS);
            document.getElementById('menu-reportes').textContent = s(d.WEB_DS_MENU_REPORTES);
            document.getElementById('menu-configuracion').textContent = s(d.WEB_DS_MENU_CONFIGURACION);
            document.getElementById('sistema-etiqueta').textContent = s(d.WEB_DS_SISTEMA_ETIQUETA);
            document.getElementById('sistema-auto').textContent = s(d.WEB_DS_SISTEMA_AUTO);

            document.getElementById('divisas-titulo').textContent = s(d.WEB_DS_DIV_TITULO);
            document.getElementById('tc-ref-etq').textContent = s(d.WEB_UI_TC_REF_ETQ);
            document.getElementById('tc-ref-val').textContent = s(d.WEB_UI_TC_REF_VAL_API);
            document.getElementById('tc-ref-dif').textContent = s(d.WEB_UI_TC_REF_DIF);
            document.getElementById('tc-ref-ico').textContent = s(d.WEB_UI_TC_REF_ICO);
            document.getElementById('tc-vta-etq').textContent = s(d.WEB_UI_TC_VTA_ETQ);
            document.getElementById('tc-vta-val').textContent = s(d.WEB_UI_TC_VTA_VAL_LOC);
            document.getElementById('tc-vta-dif').textContent = s(d.WEB_UI_TC_VTA_DIF);
            document.getElementById('tc-vta-ico').textContent = s(d.WEB_UI_TC_VTA_ICO);
            document.getElementById('tc-cpra-etq').textContent = s(d.WEB_UI_TC_CPRA_ETQ);
            document.getElementById('tc-cpra-val').textContent = s(d.WEB_UI_TC_CPRA_VAL_LOC);
            document.getElementById('tc-cpra-dif').textContent = s(d.WEB_UI_TC_CPRA_DIF);
            document.getElementById('tc-cpra-ico').textContent = s(d.WEB_UI_TC_CPRA_ICO);

            document.getElementById('pvp-titulo').textContent = s(d.WEB_DS_PVP_TITULO);
            document.getElementById('pvp-oro-etq').textContent = s(d.WEB_UI_NG_TAG_M1_L2);
            document.getElementById('pvp-oro-val').textContent = s(d.WEB_UI_NG_CIE_M1_PVP_VAL);
            document.getElementById('pvp-oro-dif').textContent = s(d.WEB_UI_NG_CIE_M1_PVP_DIF);
            document.getElementById('pvp-oro-ts').textContent = s(d.WEB_DS_PVP_TS);
            document.getElementById('pvp-plata-etq').textContent = s(d.WEB_UI_NG_TAG_M2_L1);
            document.getElementById('pvp-plata-val').textContent = s(d.WEB_UI_NG_CIE_M2_PVP_VAL);
            document.getElementById('pvp-plata-dif').textContent = s(d.WEB_UI_NG_CIE_M2_PVP_DIF);
            document.getElementById('pvp-plata-ts').textContent = s(d.WEB_DS_PVP_TS);

            document.getElementById('mercado-titulo').textContent = s(d.WEB_DS_MER_TITULO);
            document.getElementById('market-ts').textContent = s(d.WEB_UI_MC_TS_API);

            const metales = [
                { id: 'M1', nombre: s(d.WEB_METAL_GOLD) },
                { id: 'M2', nombre: s(d.WEB_METAL_SILVER) },
                { id: 'M3', nombre: s(d.WEB_METAL_PLATINUM) },
                { id: 'M4', nombre: s(d.WEB_METAL_PALLADIUM) }
            ];

            const container = document.getElementById('mercado-container');
            container.innerHTML = metales.map(m => {
                const gv = s(d[`WEB_UI_MC_${m.id}_GR_VAL_LOC`]);
                const gd = s(d[`WEB_UI_MC_${m.id}_GR_DIF_LOC`]);
                const gi = s(d[`WEB_UI_MC_${m.id}_GR_ICO`]);
                const ga = s(d[`WEB_UI_MC_${m.id}_GR_VAL_API`]);
                const ov = s(d[`WEB_UI_MC_${m.id}_OZ_VAL_LOC`]);
                const od = s(d[`WEB_UI_MC_${m.id}_OZ_DIF_LOC`]);
                const oi = s(d[`WEB_UI_MC_${m.id}_OZ_ICO`]);
                const oa = s(d[`WEB_UI_MC_${m.id}_OZ_VAL_API`]);
                const tg = s(d[`WEB_UI_MC_${m.id}_TAG_GR`]);
                const to = s(d[`WEB_UI_MC_${m.id}_TAG_OZ`]);
                const ic = (v) => v === '▲' ? 'trend-up' : v === '▼' ? 'trend-down' : 'trend-flat';

                const tieneDatos = gv !== '---' || ga !== '---' || ov !== '---' || oa !== '---';

                if (!tieneDatos) {
                    return `<div class="bg-slate-900/30 border border-slate-700/30 rounded-lg p-3">
                        <div class="flex items-center gap-2 mb-2"><span class="font-bold text-white">${m.nombre}</span></div>
                        <div class="text-xs text-slate-500">---</div>
                    </div>`;
                }

                return `<div class="bg-slate-900/30 border border-slate-700/30 rounded-lg p-3">
                    <div class="flex items-center gap-2 mb-2"><span class="font-bold text-white">${m.nombre}</span><span class="text-sm ${ic(gi)}">${gi}</span></div>
                    <div class="space-y-1 text-sm">
                        <div class="flex justify-between"><span class="text-slate-400">${tg}</span><span class="font-medium mono">${gv}</span></div>
                        <div class="flex justify-between text-xs"><span class="mono ${ic(gd)}">${gd}</span></div>
                        <div class="flex justify-between text-xs border-t border-slate-800/50 pt-1"><span class="text-slate-400">${to}</span><span class="font-medium mono">${ov}</span></div>
                        <div class="flex justify-between text-xs"><span class="mono ${ic(od)}">${od}</span></div>
                        <div class="flex justify-between text-xs text-slate-500"><span class="mono">${ga}</span></div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('negocio-titulo').textContent = s(d.WEB_DS_NEG_TITULO);

            const boxes = ['CIE', 'AM', 'MD', 'PM'];
            const items = [
                { id: 'M1_L1', etq: s(d.WEB_UI_NG_TAG_M1_L1) },
                { id: 'M1_L2', etq: s(d.WEB_UI_NG_TAG_M1_L2) },
                { id: 'M2_L1', etq: s(d.WEB_UI_NG_TAG_M2_L1) },
                { id: 'M1_PVP', etq: s(d.WEB_UI_NG_TAG_M1_PVP), pvp: true },
                { id: 'M2_PVP', etq: s(d.WEB_UI_NG_TAG_M2_PVP), pvp: true }
            ];

            const hayDatos = items.some(item => {
                return boxes.some(box => {
                    const val = d[`WEB_UI_NG_${box}_${item.id}_VAL`];
                    return val && val !== '---' && val !== '--' && val !== '-';
                });
            });

            const nc = document.getElementById('negocio-container');

            if (hayDatos) {
                let html = `<table class="w-full text-sm negocio-tabla"><thead><tr><th class="w-1/4">${s(d.WEB_UI_NG_ETQ_TIT)}</th>`;
                boxes.forEach(b => { html += `<th class="text-center">${s(d[`WEB_UI_NG_${b}_ETQ`])}<br><span class="text-[10px] font-normal text-slate-600">${s(d[`WEB_UI_NG_${b}_TS`])}</span></th>`; });
                html += `</tr></thead><tbody>`;
                items.forEach(it => {
                    const p = it.pvp || false;
                    html += `<tr class="${p ? 'bg-yellow-500/5' : ''}"><td class="font-medium ${p ? 'text-yellow-400' : 'text-slate-200'}">${it.etq}</td>`;
                    boxes.forEach(b => {
                        const v = s(d[`WEB_UI_NG_${b}_${it.id}_VAL`]);
                        const df = s(d[`WEB_UI_NG_${b}_${it.id}_DIF`]);
                        const dc = df.includes('+') ? 'trend-up' : df.includes('-') ? 'trend-down' : 'trend-flat';
                        html += `<td class="text-center mono">${v} <span class="${dc} text-xs">${df}</span></td>`;
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table>`;
                nc.innerHTML = html;
            } else {
                nc.innerHTML = '';
            }

            document.getElementById('footer-info').innerHTML = s(d.WEB_DS_FOOTER_INFO) + ' <span id="api-count" class="font-medium">' + s(d.WEB_UI_MC_CT_API) + '</span>';
        }

        function openCalc() { document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
        function closeCalc() { document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.add('hidden'); document.body.style.overflow = ''; }

        function actualizarReloj() {
            document.getElementById('live-clock').textContent = new Date().toLocaleString('es-PE', { dateStyle: 'short', timeStyle: 'medium' });
        }

        document.addEventListener('visibilitychange', () => { if (!document.hidden) cargarDatos(); });
        document.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
            actualizarReloj();
            setInterval(actualizarReloj, 1000);
            document.getElementById('btn-actualizar').addEventListener('click', cargarDatos);
        });
    </script>
</body>
</html>
